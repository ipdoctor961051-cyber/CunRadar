name: CunRadar Daily

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

concurrency:
  group: cunradar-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CUNRADAR_CONFIG_TOKEN: ${{ secrets.CUNRADAR_CONFIG_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --no-dev

      - name: Restore latest database from cache
        uses: actions/cache@v4
        with:
          path: output/cunradar.db
          key: cunradar-db-${{ github.run_id }}
          restore-keys: |
            cunradar-db-

      - name: Load follow list from admin console
        if: ${{ vars.CUNRADAR_CONFIG_URL != '' && env.CUNRADAR_CONFIG_TOKEN != '' }}
        env:
          CONFIG_URL: ${{ vars.CUNRADAR_CONFIG_URL }}
        run: |
          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${CUNRADAR_CONFIG_TOKEN}" \
            "${CONFIG_URL}" > /tmp/follow-config.json
          echo "FOLLOW_CONFIG=$(jq -c . /tmp/follow-config.json)" >> "$GITHUB_ENV"

      - name: Run CunRadar
        env:
          AI_PROVIDER: ${{ vars.AI_PROVIDER || '' }}
          AI_MODEL: ${{ vars.AI_MODEL || '' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || '' }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || '' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN || github.token }}
          CUNRADAR_PUBLIC_URL: ${{ vars.CUNRADAR_PUBLIC_URL || '' }}
          FOLLOW_CONFIG_FALLBACK: ${{ secrets.FOLLOW_CONFIG || vars.FOLLOW_CONFIG || '' }}
        run: |
          export FOLLOW_CONFIG="${FOLLOW_CONFIG:-$FOLLOW_CONFIG_FALLBACK}"
          uv run python -m cunradar

      - name: Save database to a new cache entry
        uses: actions/cache/save@v4
        with:
          path: output/cunradar.db
          key: cunradar-db-${{ github.run_id }}

      - name: Remove private database from public deployment
        run: rm -f output/cunradar.db

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy output/ --project-name=${{ vars.CUNRADAR_PROJECT_NAME || 'cunradar' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
