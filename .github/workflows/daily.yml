name: CunRadar Daily

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

concurrency:
  group: cunradar-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --no-dev

      - name: Restore latest database from cache
        uses: actions/cache@v4
        with:
          path: output/cunradar.db
          key: cunradar-db-${{ github.run_id }}
          restore-keys: |
            cunradar-db-

      - name: Run CunRadar
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN || github.token }}
          CUNRADAR_PUBLIC_URL: ${{ vars.CUNRADAR_PUBLIC_URL || '' }}
          FOLLOW_CONFIG: ${{ secrets.FOLLOW_CONFIG || vars.FOLLOW_CONFIG || '' }}
        run: uv run python -m cunradar

      - name: Save database to a new cache entry
        uses: actions/cache/save@v4
        with:
          path: output/cunradar.db
          key: cunradar-db-${{ github.run_id }}

      - name: Remove private database from public deployment
        run: rm -f output/cunradar.db

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy output/ --project-name=${{ vars.CUNRADAR_PROJECT_NAME || 'cunradar' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
