# ═══════════════════════════════════════════════════════════════
#                    CunRadar 配置文件
#                        Version: 1.0
# ═══════════════════════════════════════════════════════════════

# 基础设置
app:
  timezone: "Asia/Shanghai"
  # 只统计过去 N 小时内发布的内容
  max_item_age_hours: 24

# ─── 关注列表（示例 + 兜底） ─────────────────────────────────
# ⚠️ 如果你在公开仓库中使用，建议通过 FOLLOW_CONFIG 环境变量
#    传入真实关注列表（JSON 格式），避免暴露订阅信息。
#
#    本地开发：在 .env 中添加 FOLLOW_CONFIG=...
#    线上部署：在 GitHub Variables 中添加 FOLLOW_CONFIG
#
#    详见 README.md 中的「隐私保护」章节。
#
#    以下是 JSON 格式示例（使用村长的信息作为演示）：
#
#    FOLLOW_CONFIG='{
#      "youtube": [
#        {"name": "Web3村长", "channel_id": "UC5MbekhrH8iyFBQLbccBSRg"}
#      ],
#      "bilibili": [
#        {"name": "Web3村长Official", "uid": 1224034462}
#      ],
#      "rss": [
#        {"name": "村长博客", "url": "https://cunzhangblog.com/rss.xml"}
#      ],
#      "github": [
#        {"name": "CunRadar", "repo": "cunzhangcrypto/CunRadar"}
#      ],
#      "github_trending": {
#        "enabled": true,
#        "language": "",
#        "limit": 5
#      }
#    }'
# ────────────────────────────────────────────────────────────────
follow:

  # YouTube 频道
  youtube:
    - name: "Web3村长"
      channel_id: "UC5MbekhrH8iyFBQLbccBSRg"

  # B站 UP 主
  bilibili:
    - name: "Web3村长Official"
      uid: 1224034462

  # RSS / 博客订阅
  rss:
    - name: "村长博客"
      url: "https://cunzhangblog.com/rss.xml"

  # GitHub 项目追踪
  github:
    - name: "CunRadar"
      repo: "cunzhangcrypto/CunRadar"

  # GitHub Trending
  github_trending:
    enabled: true
    language: ""
    limit: 5

# ─── AI 配置 ───────────────────────────────────────────────────
ai:
  # AI_PROVIDER may be cloudflare or deepseek. Credentials are read only
  # from environment variables; see .env.example.
  provider: "${AI_PROVIDER}"
  model: "${AI_MODEL}"
  timeout: 120

# ─── 通知配置 ─────────────────────────────────────────────────
notification:
  telegram:
    bot_token: "${TELEGRAM_BOT_TOKEN}"
    chat_id: "${TELEGRAM_CHAT_ID}"

# ─── 输出配置 ─────────────────────────────────────────────────
output:
  dir: "output"
  # 生成 HTML 日报
  html: true
